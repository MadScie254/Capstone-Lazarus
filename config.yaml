# CAPSTONE-LAZARUS: Training Configuration
# ========================================
# Fast, reproducible training for resource-limited laptops with Colab scaling

# System Configuration
seed: 42
device: "auto"  # auto, cpu, cuda, mps

# Model Configuration  
backbone: "tf_efficientnet_b0"   # timm models: tf_efficientnet_b0, resnet18, mobilenetv3_small_100
num_classes: 19
pretrained: true

# Data Configuration - NUCLEAR SPEED MODE
image_size: 128             # NUCLEAR: Tiny images (128 vs 224)
batch_size: 32              # NUCLEAR: Huge batches for speed
num_workers: 2              # Reduce workers to avoid bottleneck
pin_memory: true

# Training Configuration - NUCLEAR SPEED  
epochs: 1                   # NUCLEAR: Single epoch only
lr: 5e-2                    # NUCLEAR: Very high learning rate
weight_decay: 1e-5          # Lower weight decay for fast convergence
optimizer: "AdamW"
scheduler: "constant"       # No scheduling for speed
warmup_epochs: 0            # NUCLEAR: No warmup

# Performance Optimization
use_amp: true              # Automatic Mixed Precision for speed/memory
gradient_accumulation_steps: 1
use_ema: true              # Exponential Moving Average
ema_decay: 0.9999

# Transfer Learning Strategy
freeze_backbone: true      # Start with frozen backbone
unfreeze_after_epochs: 10  # Unfreeze for fine-tuning
fine_tune_lr_factor: 0.1   # LR reduction for fine-tuning

# Regularization
dropout_rate: 0.3
label_smoothing: 0.1
mixup_alpha: 0.2
cutmix_alpha: 1.0

# Data Augmentation
use_augmentations: true
augmentation_strength: "medium"  # light, medium, heavy

# Quantum Layer (EXPERIMENTAL - Default OFF)
use_quantum: false         # Toggle quantum-classical hybrid
quantum:
  n_qubits: 4
  n_layers: 3
  embedding_dim: 64
  device: "default.qubit"

# Checkpointing & Monitoring
save_dir: "./models"
checkpoint_freq: 5
early_stopping_patience: 10
monitor_metric: "val_accuracy"
save_best_only: true

# Logging & Tracking
use_wandb: false           # Weights & Biases integration
wandb_project: "capstone-lazarus"
log_freq: 100

# Development & Testing
subset_training: null      # Set to integer for subset training (e.g., 1000)
debug_mode: false
verbose: true

# Resume Training
resume_checkpoint: null    # Path to checkpoint for resuming

# Hardware-Specific Optimizations
# HP ZBook G5 Optimizations
hp_zbook_mode: true        # Enable specific optimizations
memory_efficient: true    # Reduce memory usage
mixed_precision_opt_level: "O1"

# Colab Optimizations  
colab_mode: false          # Enable when running in Colab
use_tpu: false             # TPU support for Colab
drive_mount_path: "/content/drive/MyDrive/Capstone-Lazarus"

# Model Export
export_onnx: true          # Export to ONNX for deployment
quantize_model: true       # Post-training quantization
target_model_size_mb: 50   # Target size for edge deployment

# Master Training Orchestration
training_suite:
  fast_test:
    enabled: true
    sample_ratio: 0.02           # Use 2% of the data for smoke runs
    max_images_per_class: 2
    epochs: 1
    notes: "Classifier-head only sanity check"
  default:
    freeze_backbone: true
    finetune:
      enabled: true
      unfreeze_blocks: 4         # Unfreeze last N blocks for light FT
      epochs: 6
    head_training_epochs: 4
    batch_size_floor: 4          # Floor when auto-reducing batch size
    patience: 2

models:
  - name: "efficientnet_b0"
    backbone: "tf_efficientnet_b0"
    image_size: 224
    batch_size: 8
    learning_rate: 0.001
    weight_decay: 0.0001
    phases:
      - type: "head"
        epochs: 4
        freeze_backbone: true
      - type: "finetune"
        epochs: 6
        unfreeze_blocks: 4
    notes: "Primary baseline"
  - name: "mobilenet_v3_small"
    backbone: "mobilenetv3_small"
    image_size: 224
    batch_size: 8
    learning_rate: 0.0007
    weight_decay: 0.00005
    phases:
      - type: "head"
        epochs: 3
        freeze_backbone: true
      - type: "finetune"
        epochs: 5
        unfreeze_blocks: 6
    notes: "Mobile-friendly baseline"